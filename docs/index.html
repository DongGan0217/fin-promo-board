<!doctype html>

<head>

<meta name="description" content="금융권 임원·본부장·부서장·지점장 인사 발표를 언론 보도 기준으로 정리한 보드">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">

<body>
<header class="gnb">
